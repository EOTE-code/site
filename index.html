<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of the Elements | Official Book Site</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <p class="subtitle">An Epic Elemental Fantasy Novel</p>
            <h1 class="book-title">ECHOES <br><span>of the</span> ELEMENTS</h1>
            <p class="tagline">"Every element remembers. Every echo carries a curse."</p>
            <div class="cta-buttons">
                <button class="btn primary">Read Chapter One</button>
                <button class="btn secondary">Pre-Order Now</button>
            </div>
        </div>
    </header>

    <main class="container">
        
        <section class="elements-section">
            <h2>The Lore: Echoes of the Elements</h2>
            <p class="instruction">Filter by element category to explore the histories and royal lineages:</p>
            
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All Echoes</button>
                <button class="filter-btn" data-filter="air">Air</button>
                <button class="filter-btn" data-filter="earth">Earth</button>
                <button class="filter-btn" data-filter="electricity">Electricity</button>
                <button class="filter-btn" data-filter="fire">Fire</button>
                <button class="filter-btn" data-filter="ice">Ice</button>
                <button class="filter-btn" data-filter="magic">Magic</button>
                <button class="filter-btn" data-filter="water">Water</button>
            </div>

            <div id="elements-grid" class="grid-layout"></div>
        </section>

    </main>

</body>
</html>
